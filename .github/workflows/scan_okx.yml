name: Wick Hunter OKX Auto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: wickhunter-okx
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan OKX public USDT perpetuals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner_dual_alert.py
      - name: Attach the analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wick-hunter-okx-report
          path: report_okx.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Remember open zones across runs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state_okx.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: cache OKX watch zones [skip ci]'
            git push
          fi
