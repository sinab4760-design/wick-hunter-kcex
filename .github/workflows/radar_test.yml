name: Wick Hunter Radar V7 DRY RUN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar_test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python test_market_radar.py
      - name: Market-wide ticker screen and limited candle check (no Telegram)
        run: python scanner_market_radar.py --dry-run
        env:
          MAX_DEEP_SCAN: '60'
      - name: Attach radar report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wick-hunter-radar-report
          path: report_radar.json
          if-no-files-found: ignore
          retention-days: 3
