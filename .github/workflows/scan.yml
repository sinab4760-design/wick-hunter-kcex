name: Wick Hunter KCEX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Download scanner
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test KCEX Scanner
        run: python scanner.py

      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wick-hunter-report
          path: report.json
          if-no-files-found: ignore
